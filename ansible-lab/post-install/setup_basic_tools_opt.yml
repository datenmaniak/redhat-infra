---
- name: Configuración Inicial - Herramientas Esenciales para Laboratorio
  hosts: all
  become: yes
  serial: "{{ update_serial | default(1) }}"

  vars:
    # Lista completa de paquetes con sus repositorios
    packages:
      # Repositorios base (siempre disponibles)
      base:
        - vim
        - nano
        - tmux
        - bash-completion
        - bind-utils
        - net-tools
        - tree
        - git
        - wget
        - curl
        - telnet
        - traceroute
      
      # Repositorios EPEL (requieren instalación)
      epel:
        - neovim
        - htop

  tasks:
    - name: 1. Verificar conectividad y sistema
      debug:
        msg: "🖥️ Configurando {{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }})"
      tags: [always]

    - name: 2. Verificar si EPEL está instalado
      command: rpm -q epel-release
      register: epel_check
      changed_when: False
      failed_when: False
      tags: [epel]

    - name: 3. Instalar EPEL release
      dnf:
        name: epel-release
        state: present
      when: epel_check.rc != 0
      register: epel_install
      tags: [epel]

    - name: 4. Actualizar caché de repositorios
      dnf:
        update_cache: yes
      tags: [update]

    - name: 5. Instalar paquetes base
      dnf:
        name: "{{ packages.base }}"
        state: present
      register: base_install
      tags: [install, base]

    - name: 6. Instalar paquetes desde EPEL
      dnf:
        name: "{{ packages.epel }}"
        state: present
      register: epel_install_result
      ignore_errors: yes
      tags: [install, epel]

    - name: 7. Resumen final
      debug:
        msg: |
          ✅ {{ inventory_hostname }} - Configuración completada

          📦 Paquetes base ({{ packages.base | length }}):
          {% for pkg in packages.base %}
          ✅ {{ pkg }}
          {% endfor %}

          📦 Paquetes EPEL ({{ packages.epel | length }}):
          {% for pkg in packages.epel %}
          {% if epel_install_result.results is defined and epel_install_result.results | selectattr('invocation.module_args.name', 'equalto', pkg) | list | length > 0 %}
          ✅ {{ pkg }}
          {% else %}
          ⚠️ {{ pkg }} (no disponible - EPEL puede no estar habilitado)
          {% endif %}
          {% endfor %}
      tags: [report]